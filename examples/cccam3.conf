# =====================================================================
# CCcam3 - Exemplo de configuração COMPLETA
# Contém TODAS as opções suportadas pelo servidor, com descrição.
#
# Localização em produção: /etc/cccam3/cccam3.conf
#
# Regras do ficheiro:
#   - Linhas começadas por '#' ou ';' são comentários
#   - As opções estão agrupadas em secções: [nome_da_seccao]
#   - Formato: chave = valor
#   - Booleanos aceitam: 1 / yes / true (e 0 / no / false)
#   - Valores hexadecimais (CAID, PROVID) são lidos em base 16
# =====================================================================

# ---------------------------------------------------------------------
# [global] - Identificação e porta principal do servidor
# ---------------------------------------------------------------------
[global]

# Porta de escuta do servidor CCcam (clientes apontam para esta porta).
# Intervalo: 1 - 65535. Valor por omissão: 12000
port = 12000

# Nome do servidor (mostrado nos logs e na API REST).
server_name = CCcam3

# Número máximo de ligações simultâneas (CCcam + Newcamd + leitores remotos).
# Usado também pelo balanceador de carga. Valor por omissão: 100
max_clients = 100

# ---------------------------------------------------------------------
# [logging] - Registo de atividade
# ---------------------------------------------------------------------
[logging]

# Gravação em ficheiro: 1 = escreve no ficheiro indicado em "file",
# 0 = só consola (stdout/stderr). Valor por omissão: 1
enabled = 1

# Nível de detalhe dos logs:
#   0 = ERROR  (apenas erros)
#   1 = WARN   (erros + avisos)
#   2 = INFO   (erros + avisos + informação geral)  <- recomendado
#   3 = DEBUG  (tudo + mensagens de depuração)
#   4 = TRACE  (muito verboso - só para investigação)
level = 2

# Caminho do ficheiro de log. Comentar esta linha para log apenas na consola.
# Certifica-te de que o processo tem permissões de escrita na pasta.
file = /var/log/cccam3.log

# ---------------------------------------------------------------------
# [cache] - Cache de Control Words (CWs)
# A cache evita ir ao leitor em cada ECM: reduz a latência no zapping.
# ---------------------------------------------------------------------
[cache]

# 1 = cache ativa (recomendado), 0 = desativa a cache
enabled = 1

# Tempo de vida de cada CW na cache, em segundos.
# Valores típicos: 5 - 30. Valor por omissão: 10
timeout = 10

# ---------------------------------------------------------------------
# [security] - Modos de encriptação permitidos
# Controla que algoritmos o servidor aceita negociar com os clientes.
# ---------------------------------------------------------------------
[security]

# Bitmask dos modos permitidos (hexadecimal):
#   0x01 = RC4
#   0x02 = AES (128/256)
#   0x04 = 3DES
#   0x10 = AES-GCM
# Exemplos:
#   0x17 = todos (RC4 + AES + 3DES + AES-GCM)  <- por omissão
#   0x01 = apenas RC4 (compatibilidade máxima)
#   0x10 = apenas AES-GCM (mais seguro)
#   0    = permitir todos (sem restrição)
allowed_crypt_modes = 0x17

# ---------------------------------------------------------------------
# [hop_control] - Controlo de saltos (hops)
# Um "hop" é o número de servidores entre o cartão original e o cliente.
# ---------------------------------------------------------------------
[hop_control]

# Limite máximo de hops aceite (1 - 20).
# Pedidos com hop superior a este valor são rejeitados.
# Valor por omissão: 3
max_hops = 3

# Tempo (segundos) que um registo de hop fica guardado antes de ser limpo.
# Valor por omissão: 60
timeout = 60

# Reservado: a deteção automática de loops por repetição foi removida
# (bloqueava pedidos legítimos). Esta opção não tem efeito nesta versão.
block_loops = 1

# ---------------------------------------------------------------------
# [rest_api] - API REST (monitorização por HTTP/JSON)
# ---------------------------------------------------------------------
[rest_api]

# 1 = ativa a API REST, 0 = desativa
enabled = 1

# Porta HTTP da API REST. 0 = desativar.
# Endpoints: /status /stats /stats/cache /stats/ecm /stats/readers /channels /web
port = 8080

# Autenticação HTTP Basic (recomendado em produção).
# Comentar as duas linhas para desativar a autenticação.
# user = admin
# password = muda-me

# ---------------------------------------------------------------------
# [web_interface] - Painel web
# ---------------------------------------------------------------------
[web_interface]

# 1 = ativa a interface web (servida pela API REST)
enabled = 1

# Caminho da rota da interface web. Valor por omissão: /web
path = /web

# ---------------------------------------------------------------------
# [user_manager] - Gestão de utilizadores
# ---------------------------------------------------------------------
[user_manager]

# 1 = ativa a autenticação de clientes, 0 = desativa
enabled = 1

# Ficheiro com a lista de utilizadores (ver examples/cccam3.users).
# Se o caminho for relativo e o ficheiro não existir, o servidor procura
# também em /etc/cccam3/<nome>.
# Sem ficheiro válido, é criado o utilizador admin/admin123 por omissão.
file = conf/cccam3.users

# 1 = regista automaticamente utilizadores desconhecidos (nível USER,
# max_hops 2) e persiste-os no ficheiro. 0 = recusa (recomendado).
auto_register = 0

# ---------------------------------------------------------------------
# [newcamd] - Servidor Newcamd (protocolo real newcs/cs357x)
# ---------------------------------------------------------------------
[newcamd]

# 1 = ativa o listener Newcamd, 0 = desativa
enabled = 1

# Porta do protocolo Newcamd. Valor por omissão: 34000
port = 34000

# CAID servido pela porta Newcamd (hexadecimal).
# 0 = qualquer (útil para EMU). Os clientes Newcamd anunciam um único CAID.
caid = 0500

# Chave DES do protocolo Newcamd (28 caracteres hex = 14 bytes).
# Os clientes (mgcamd/OSCam) têm de usar a mesma chave na linha CWS.
# 0102030405060708090a0b0c0d0e é a chave clássica do protocolo.
key = 0102030405060708090a0b0c0d0e

# ---------------------------------------------------------------------
# [emu] - Motor de emulação (SoftCam.Key)
# ---------------------------------------------------------------------
[emu]

# Ficheiro de chaves SoftCam.Key (Viaccess, BISS).
key_file = conf/SoftCam.Key

# ---------------------------------------------------------------------
# [dvbapi] - DVBAPI por socket (estilo OSCam)
# Permite a descodificadores/softcams locais (ex.: enigma2 com dvbapi)
# ligarem-se ao servidor por UNIX socket e enviarem ECMs.
# ---------------------------------------------------------------------
[dvbapi]

# 1 = ativa a DVBAPI por socket, 0 = desativa
enabled = 1

# Caminho do UNIX socket local (o servidor ESCUTA neste socket).
socket = /tmp/camd.socket

# Número máximo de ligações/demux simultâneas. Valor por omissão: 8
max_demux = 8

# ---------------------------------------------------------------------
# [dvb] - Leitor direto do tuner DVB (S/S2/C/C2)
# O servidor sintoniza o transponder, lê a info dos canais (PAT/SDT/PMT),
# apanha os ECMs e vai buscar as CWs aos leitores (remotos/locais/EMU),
# injetando-as depois no descrambler do demux.
# ---------------------------------------------------------------------
[dvb]

# 1 = ativa a leitura do tuner, 0 = desativa (ex.: VPS sem hardware)
enabled = 1

# Índice do adaptador DVB: /dev/dvb/adapter<N>
adapter = 0

# Índice do frontend: /dev/dvb/adapter<N>/frontend<M>
frontend = 0

# Índice do demux de secções: /dev/dvb/adapter<N>/demux<K>.
# O demux K+1 é usado para o vídeo/descrambler (se existir).
demux = 0

# Frequência do transponder em kHz.
#   Satélite (ex.): 11836000 | Cabo (ex.): 442000
frequency_khz = 11836000

# Symbol rate (bauds).
#   Satélite típico: 27500000 | Cabo típico: 6900000
symbol_rate = 27500000

# Sistema de entrega:
#   auto   = deteta pelo tipo do frontend (recomendado)
#   dvb-s  = DVB-S
#   dvb-s2 = DVB-S2
#   dvb-c  = DVB-C
#   dvb-c2 = DVB-C2
delivery_system = auto

# Modulação:
#   auto | qpsk | psk_8 | qam_16 | qam_32 | qam_64 | qam_128 | qam_256
#   Satélite: qpsk (S) / psk_8 (S2) | Cabo: qam_64 / qam_256
modulation = auto

# FEC (Forward Error Correction):
#   auto | 1_2 | 2_3 | 3_4 | 5_6 | 7_8 | 8_9 | 9_10
fec = auto

# Inversão espectral: auto | on | off
inversion = auto

# Polarização (apenas satélite): controla a voltagem do LNB.
#   auto | h (horizontal, 18V) | v (vertical, 13V)
polarity = auto

# SID do canal a descodificar (hexadecimal ou decimal).
#   0 = usar o primeiro canal com ECM encontrado no transponder.
service_id = 0

# ---------------------------------------------------------------------
# [stapi] - STAPI (apenas hardware STMicroelectronics)
# Usa a libstapi.so do STLinux (dlopen). Sem a biblioteca/hardware ST,
# a inicialização falha e o servidor continua sem STAPI.
# ---------------------------------------------------------------------
[stapi]

# 1 = ativa o STAPI, 0 = desativa (recomendado 0)
enabled = 0

# Dispositivo STAPI (específico do hardware)
device = /dev/stapi
