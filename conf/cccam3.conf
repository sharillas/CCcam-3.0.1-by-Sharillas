# Ficheiro de configuração CCcam3

[global]
# Porta de escuta
port = 12000

# Nome do servidor
server_name = CCcam3

# Número máximo de clientes
max_clients = 100

[logging]
# Nível de log: 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG
level = 2

# Ficheiro de log (comentar para stdout)
file = /var/log/cccam3.log

[cache]
# Ativar cache de CWs
enabled = 1

# Tempo de vida da cache (segundos)
timeout = 10

[security]
# Modos de encriptação permitidos (bitmask)
# 0x01 = RC4, 0x02 = AES, 0x04 = 3DES, etc.
allowed_crypt_modes = 0x07
