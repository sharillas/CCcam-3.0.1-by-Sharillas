# Ficheiro de configuração CCcam3

[global]
# Porta de escuta do servidor
port = 12000

# Nome do servidor (identificação)
server_name = CCcam3

# Número máximo de clientes simultâneos
max_clients = 100

# Máximo de ECMs por segundo por cliente (0 = sem limite)
max_ecm_per_sec = 50

# Filtros de IP (separados por vírgula; prefixos aceites: "1.2", "1.2.3")
# allow_ips = 192.168.1.
# deny_ips = 10.0.0.5

# Pidfile do modo daemon (-d)
pid_file = /var/run/cccam3.pid

# Ficheiros de canais/provedores (mostram o nome do canal no painel web)
providers_file = conf/CCcam.providers
channelinfo_file = conf/CCcam.channelinfo

[logging]
# Nível de log: 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=TRACE
level = 2

# Ficheiro de log (comentar para stdout)
file = /var/log/cccam3.log

# Rotação por tamanho em MB (0 = desativada)
max_size_mb = 50

[cache]
# Ativar cache de CWs (1=sim, 0=não)
enabled = 1

# Tempo de vida da cache em segundos
timeout = 10

[security]
# Modos de encriptação permitidos (bitmask)
# 0x01 = RC4, 0x02 = AES, 0x04 = 3DES, 0x10 = AES-GCM
allowed_crypt_modes = 0x17

# Falhas de login por IP antes de bloquear 60 segundos
max_login_failures = 5

[hop_control]
# Limite máximo de hops (1-10)
max_hops = 3

# Timeout para registo de hops (segundos)
timeout = 60

# Bloquear loops automáticos
block_loops = 1

[rest_api]
# Porta da API REST (0 para desativar)
port = 8080

# Ativar API REST (1=sim, 0=não)
enabled = 1

# Autenticação HTTP Basic (comentar/remover para desativar)
# user = admin
# password = muda-me

[web_interface]
# Ativar interface web (1=sim, 0=não)
enabled = 1

# Caminho da interface web
path = /web

[user_manager]
# Ativar gestão de utilizadores (1=sim, 0=não)
enabled = 1

# Ficheiro de utilizadores
file = conf/cccam3.users

# Permitir registo automático de novos utilizadores (1=sim, 0=não)
auto_register = 0

[newcamd]
# Ativar suporte a Newcamd (1=sim, 0=não)
enabled = 1

# Porta para Newcamd
port = 34000

# CAID servido pela porta Newcamd (hex; 0 = qualquer/EMU)
caid = 0500

# Chave DES do protocolo Newcamd (28 chars hex = 14 bytes)
# 01 02 ... 0E é a chave clássica
key = 0102030405060708090a0b0c0d0e

[emu]
# Ficheiro de chaves SoftCam.Key (Viaccess, BISS)
key_file = conf/SoftCam.Key

[dvbapi]
# Ativar DVB-API (1=sim, 0=não)
enabled = 1

# Caminho do socket DVBAPI (usado pelo OSCam/descodificador)
socket = /tmp/camd.socket

# Número máximo de demux
max_demux = 8

[stapi]
# Ativar STAPI (1=sim, 0=não) - apenas para hardware STMicroelectronics
enabled = 0

# Caminho do dispositivo STAPI
device = /dev/stapi

[dvb]
# Leitor direto do tuner DVB (S/S2/C/C2) - obtém a info do canal,
# envia os ECMs aos leitores remotos e injeta as CWs no descrambler
enabled = 1

# Adaptador e frontend a usar
adapter = 0
frontend = 0
demux = 0

# Frequência em kHz (ex.: 11836000 para satélite, 442000 para cabo)
frequency_khz = 11836000

# Symbol rate (ex.: 27500000 DVB-S/S2, 6900000 DVB-C)
symbol_rate = 27500000

# delivery_system: auto | dvb-s | dvb-s2 | dvb-c | dvb-c2 | dvb-t | dvb-t2
delivery_system = auto

# bandwidth (apenas DVB-T/T2): 6 | 7 | 8 (0 = 8 MHz)
bandwidth = 8

# modulation: auto | qpsk | psk_8 | qam_16 | qam_32 | qam_64 | qam_128 | qam_256
modulation = auto

# fec: auto | 1_2 | 2_3 | 3_4 | 5_6 | 7_8 | 8_9 | 9_10
fec = auto

# inversion: auto | on | off
inversion = auto

# polarity (apenas satélite): auto | h | v
polarity = auto

# service_id do canal (0 = primeiro canal com ECM do transponder)
service_id = 0
