# =====================================================================
#  CCcam3 - Ficheiro de configuração principal
#  (explicado em linguagem simples, para leigos)
#
#  Como funciona este ficheiro?
#  - As linhas que começam por # são comentários (o servidor ignora-as)
#  - As configurações estão agrupadas em secções: [nome_da_seccao]
#  - Dentro de cada secção, cada linha é:  opcao = valor
#
#  Importante:
#  - Para "ligar" uma opção usa: 1   (ou yes / true)
#  - Para "desligar" usa:        0   (ou no / false)
#  - IPs e portas são como os da tua rede; CAIDs são em hexadecimal
# =====================================================================


# ---------------------------------------------------------------------
# [global] - A identidade e as portas do teu servidor
# ---------------------------------------------------------------------
[global]

# A porta onde o servidor espera os clientes do protocolo CCcam.
# Pensa nisto como "o número da campainha". Os clientes têm de a usar
# na linha C: (ex.: C: teu-ip 12000 utilizador password).
port = 12000

# O nome do servidor (aparece nos logs e no painel web). É só cosmético.
server_name = CCcam3

# Quantos clientes podem estar ligados ao mesmo tempo.
# Cada amigo ligado conta como 1. Se tiveres 10 amigos, 20 chega bem.
max_clients = 100

# Limite de pedidos de chave por segundo, por cliente.
# Cada canal ligado faz cerca de 1 pedido a cada 5-10 segundos, por isso
# 50 por segundo é muito à vontade. Serve para impedir que um cliente
# mal comportado entupa o servidor. 0 = sem limite.
max_ecm_per_sec = 50

# Lista de IPs que PODEM ligar-se (separados por vírgula).
# Se deixares vazio (comentar com #), todos os IPs podem ligar-se.
# Podes usar só parte do IP: "192.168.1." deixa entrar toda a rede local.
# allow_ips = 192.168.1., 10.0.0.7

# Lista de IPs que NUNCA podem ligar-se (separados por vírgula).
# Útil para bloquear um chato específico.
# deny_ips = 82.154.99.13

# Onde o servidor guarda o ficheiro com o seu "bilhete de identidade"
# quando corre em segundo plano (-d). Não é preciso mudar.
pid_file = /var/run/cccam3.pid


# ---------------------------------------------------------------------
# [logging] - O que o servidor escreve no "diário" (log)
# ---------------------------------------------------------------------
[logging]

# Quanto detalhe queres no diário:
#   0 = só erros graves
#   1 = erros + avisos
#   2 = informação normal (recomendado para o dia a dia)
#   3 = tudo (útil para descobrir problemas)
#   4 = tudo e mais alguma coisa (só para investigação)
level = 2

# O ficheiro onde o diário é escrito. Comenta a linha (#) para só
# aparecer no ecrã. A pasta tem de existir e o servidor tem de poder
# escrever lá.
file = /var/log/cccam3.log

# Tamanho máximo do diário em MB. Quando chega a esse tamanho, o
# servidor guarda o antigo como "cccam3.log.1" e começa um novo.
# 0 = nunca rodar (o ficheiro cresce para sempre).
max_size_mb = 50


# ---------------------------------------------------------------------
# [cache] - A "memória" das chaves
# ---------------------------------------------------------------------
[cache]

# A memória guarda a última chave de cada canal. Se o canal for pedido
# outra vez pouco depois, a resposta sai da memória (instantâneo) em vez
# de ir aos leitores. 1 = ligada (recomendado), 0 = desligada.
enabled = 1

# Durante quantos segundos a chave fica guardada. As chaves mudam a cada
# 10 segundos nos canais reais, por isso 10 é o valor certo. Mais tempo
# arrisca dar chaves velhas; menos tempo aumenta os pedidos aos leitores.
timeout = 10


# ---------------------------------------------------------------------
# [security] - A segurança da ligação entre servidor e clientes
# ---------------------------------------------------------------------
[security]

# Que "fechaduras" (encriptação) são permitidas nas ligações. É uma soma
# de valores em hexadecimal:
#   0x01 = RC4        (a mais antiga, compatível com tudo)
#   0x02 = AES        (moderna)
#   0x04 = 3DES       (alternativa)
#   0x10 = AES-GCM    (a mais segura: verifica que nada foi alterado)
# Exemplos:
#   0x17 = todas as fechaduras (recomendado)
#   0x01 = só RC4 (máxima compatibilidade com clientes antigos)
#   0    = sem restrição (aceita o que o cliente pedir)
allowed_crypt_modes = 0x17

# Quantas tentativas de password errada um IP pode fazer antes de ser
# posto de castigo (bloqueado) durante 60 segundos. Impede que alguém
# tente adivinhar passwords.
max_login_failures = 5


# ---------------------------------------------------------------------
# [hop_control] - Quantos "saltos" a chave pode dar
# ---------------------------------------------------------------------
[hop_control]

# Um "hop" é cada servidor por onde a chave passa. O dono do cartão é
# hop 0, tu és hop 1, o teu amigo é hop 2, etc.
# Este valor define o MÁXIMO de saltos que o teu servidor aceita servir.
# 3 é o valor clássico (cartão -> tu -> amigo -> amigo do amigo).
max_hops = 3

# Durante quantos segundos o servidor se lembra de cada pedido
# (usado para controlar os saltos). Não é preciso mexer.
timeout = 60

# Reservado (não tem efeito nesta versão). Mantém por compatibilidade.
block_loops = 1


# ---------------------------------------------------------------------
# [rest_api] - O painel de gestão (o sitezinho do servidor)
# ---------------------------------------------------------------------
[rest_api]

# 1 = liga o painel (recomendado), 0 = desliga.
enabled = 1

# A porta do painel no navegador: http://IP-do-servidor:8080
port = 8080

# Utilizador e password para entrar no painel. SE COMENTARES ESTAS DUAS
# LINHAS, qualquer pessoa com acesso à porta 8080 consegue ver e mexer
# no teu servidor. NÃO faças isso num servidor exposto à internet!
user = admin
password = muda-me


# ---------------------------------------------------------------------
# [web_interface] - O aspeto do painel
# ---------------------------------------------------------------------
[web_interface]

# 1 = mostra o painel bonito em http://IP:8080/web
enabled = 1

# O endereço (caminho) do painel no navegador. Não é preciso mudar.
path = /web


# ---------------------------------------------------------------------
# [user_manager] - A gestão dos teus clientes
# ---------------------------------------------------------------------
[user_manager]

# 1 = só entra quem estiver na lista (cccam3.users).
# 0 = toda a gente entra (NÃO recomendado!).
enabled = 1

# O ficheiro com a lista de clientes. Se o ficheiro não existir neste
# caminho, o servidor procura em /etc/cccam3/.
file = conf/cccam3.users

# 1 = qualquer pessoa que tente entrar com uma password nova é aceite
# automaticamente e fica registada na lista. PERIGOSO em servidores
# públicos — é porta aberta para estranhos. Recomendado: 0.
auto_register = 0


# ---------------------------------------------------------------------
# [newcamd] - A porta para clientes do protocolo Newcamd (mgcamd/OSCam)
# ---------------------------------------------------------------------
[newcamd]

# 1 = liga esta porta (recomendado), 0 = desliga.
enabled = 1

# A porta Newcamd. Os clientes usam-na na linha CWS:
#   CWS = teu-ip 34000 user pass 01 02 ... 0E
port = 34000

# O CAID que esta porta anuncia. Como o protocolo Newcamd só serve um
# sistema de cada vez por porta, diz aqui qual (ex.: 0500 para Viaccess).
# 0 = qualquer (útil para EMU).
caid = 0500

# A chave DES do protocolo Newcamd (28 caracteres hex = 14 bytes).
# Os clientes TÊM de usar exatamente a mesma chave na linha CWS.
# 0102030405060708090a0b0c0d0e é a chave clássica de toda a gente.
key = 0102030405060708090a0b0c0d0e


# ---------------------------------------------------------------------
# [emu] - As chaves de emulação (abre canais sem cartão)
# ---------------------------------------------------------------------
[emu]

# O ficheiro SoftCam.Key (as chaves BISS, Viaccess, PowerVU, etc.).
# Quando mudas este ficheiro, não precisas de reiniciar o servidor:
#   kill -HUP $(cat /var/run/cccam3.pid)
key_file = conf/SoftCam.Key


# ---------------------------------------------------------------------
# [dvbapi] - A ligação à tua box (desc descodifica e o servidor dá a chave)
# ---------------------------------------------------------------------
[dvbapi]

# 1 = liga (recomendado se tens box enigma2), 0 = desliga.
enabled = 1

# O "tubo" por onde a box fala com o servidor (um ficheiro especial do
# sistema, não é uma porta de rede). A box envia os pedidos de chave e o
# servidor responde. Não é preciso mudar.
socket = /tmp/camd.socket

# Quantas ligações de boxes em simultâneo. Uma box = uma ligação.
max_demux = 8


# ---------------------------------------------------------------------
# [dvb] - Ler os canais diretamente da antena (tuner do próprio servidor)
# ---------------------------------------------------------------------
[dvb]

# 1 = liga a leitura direta da antena.
# 0 = desliga (usa 0 se o teu servidor não tem placa de antena, como num VPS).
enabled = 1

# O número da placa de antena: /dev/dvb/adapter<N>
adapter = 0

# O número do sintonizador: /dev/dvb/adapter<N>/frontend<M>
frontend = 0

# O número do "desembrulhador" de secções: /dev/dvb/adapter<N>/demux<K>
demux = 0

# A frequência do transponder (o "canal de transporte") em kHz.
#   Satélite (ex.): 11836000   |   Cabo (ex.): 442000   |   TDT (ex.): 474000
frequency_khz = 11836000

# A velocidade de símbolos ("symbol rate").
#   Satélite típico: 27500000   |   Cabo típico: 6900000
symbol_rate = 27500000

# O tipo de transmissão:
#   auto   = o servidor descobre sozinho (recomendado)
#   dvb-s  = satélite (DVB-S)
#   dvb-s2 = satélite (DVB-S2)
#   dvb-c  = cabo (DVB-C)
#   dvb-c2 = cabo (DVB-C2)
#   dvb-t  = TDT terrestre (DVB-T)
#   dvb-t2 = TDT terrestre (DVB-T2)
delivery_system = auto

# A largura do canal para TDT (6, 7 ou 8 MHz). Em Portugal/Espanha é 8.
# Não tem efeito em satélite/cabo.
bandwidth = 8

# A modulação (a "letra" do sinal). auto funciona quase sempre.
#   auto | qpsk | psk_8 | qam_16 | qam_32 | qam_64 | qam_128 | qam_256
modulation = auto

# A correção de erros (FEC). auto funciona quase sempre.
#   auto | 1_2 | 2_3 | 3_4 | 5_6 | 7_8 | 8_9 | 9_10
fec = auto

# Inversão do sinal: auto | on | off. Quase nunca é preciso mexer.
inversion = auto

# Polarização (só satélite): auto | h (horizontal) | v (vertical).
# Controla a voltagem que vai para o LNB.
polarity = auto

# O canal a ver (SID). 0 = o primeiro canal com chave do transponder.
service_id = 0


# ---------------------------------------------------------------------
# [stapi] - Para descodificadores STMicroelectronics antigos
# ---------------------------------------------------------------------
[stapi]

# Só liga isto se a tua box é mesmo da STMicroelectronics (raro hoje).
# Para tudo o resto usa [dvbapi]. Recomendado: 0.
enabled = 0

# O dispositivo STAPI. Não é preciso mudar.
device = /dev/stapi
