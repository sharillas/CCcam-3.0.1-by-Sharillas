name: Build release binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release onde anexar os binários'
        required: false
        default: 'v3.0.1'
  release:
    types: [published]

permissions:
  contents: write

env:
  OPENSSL_VERSION: 1.1.1w
  OPENSSL_PREFIX: /tmp/ssl
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'release' && github.ref_name || github.event.inputs.release_tag) }}

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Criar release a partir da tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cria a release via API (erros ficam visiveis no log)
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_TAG\",\"generate_release_notes\":true}" \
            -o /tmp/release.json || \
          curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o /dev/null || exit 1
          echo "Release pronta: $RELEASE_TAG"

  build:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_32
            cc: gcc
            cflags: -m32
            openssl_target: linux-x86
            openssl_extra: -m32
            packages: gcc-multilib
          - name: x86_64
            cc: gcc
            cflags: ""
            openssl_target: linux-x86_64
            openssl_extra: ""
            packages: ""
          - name: armv7
            cc: arm-linux-gnueabihf-gcc
            cflags: ""
            openssl_target: linux-armv4
            openssl_extra: ""
            packages: gcc-arm-linux-gnueabihf
          - name: aarch64
            cc: aarch64-linux-gnu-gcc
            cflags: ""
            openssl_target: linux-aarch64
            openssl_extra: ""
            packages: gcc-aarch64-linux-gnu
          - name: mipsel
            cc: mipsel-linux-gnu-gcc
            cflags: ""
            openssl_target: linux-mips32
            openssl_extra: -EL
            packages: gcc-mipsel-linux-gnu
          - name: mips64el
            cc: mips64el-linux-gnuabi64-gcc
            cflags: ""
            openssl_target: linux-mips64
            openssl_extra: -EL -mabi=64
            packages: gcc-mips64el-linux-gnuabi64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file ${{ matrix.packages }}

      - name: Cache OpenSSL
        id: cache-ssl
        uses: actions/cache@v4
        with:
          path: /tmp/ssl
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.name }}

      - name: Build OpenSSL
        if: steps.cache-ssl.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/openssl-build
          cd /tmp/openssl-build
          curl -sfL -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz
          tar xzf openssl.tar.gz
          cd openssl-OpenSSL_1_1_1w
          CC=${{ matrix.cc }} ./Configure ${{ matrix.openssl_target }} no-shared ${{ matrix.openssl_extra }} --prefix=${{ env.OPENSSL_PREFIX }}
          make -j4
          make install_sw

      - name: Build CCcam3
        run: |
          make clean
          make CC=${{ matrix.cc }} CFLAGS="-Wall -Wextra -O2 -Iinclude -Isrc/core -Isrc/network -Isrc/CCshare -Isrc/api -Isrc/hardware -DUSE_OPENSSL -I$OPENSSL_PREFIX/include ${{ matrix.cflags }} -no-pie" LDFLAGS="-L$OPENSSL_PREFIX/lib -static -lssl -lcrypto -lm -lpthread -ldl"
          file bin/cccam3
          cp bin/cccam3 cccam3-${{ matrix.name }}
          chmod +x cccam3-${{ matrix.name }}
          ls -la cccam3-${{ matrix.name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" cccam3-${{ matrix.name }} --clobber

      - name: Upload artifact for ipk
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: cccam3-${{ matrix.name }}

  ipk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins

      - name: Assemble ipk
        run: |
          IPK_VERSION="${RELEASE_TAG#v}"
          mkdir -p ipkdata/etc/init.d \
                   ipkdata/usr/bin \
                   ipkdata/usr/share/cccam3 \
                   ipkdata/usr/lib/enigma2/python/Plugins/Extensions/CCcam3 \
                   ipkctrl
          cp packages/ipk/CONTROL/control ipkctrl/control
          sed -i "s/^Version: .*/Version: $IPK_VERSION/" ipkctrl/control
          cp packages/ipk/CONTROL/postinst ipkctrl/postinst
          cp packages/ipk/CONTROL/prerm ipkctrl/prerm
          chmod 0755 ipkctrl/postinst ipkctrl/prerm
          cp packages/ipk/etc/init.d/cccam3 ipkdata/etc/init.d/cccam3
          chmod 0755 ipkdata/etc/init.d/cccam3
          cp packages/ipk/usr/lib/enigma2/python/Plugins/Extensions/CCcam3/plugin.py \
             ipkdata/usr/lib/enigma2/python/Plugins/Extensions/CCcam3/plugin.py
          cp examples/cccam3.conf ipkdata/usr/share/cccam3/cccam3.conf
          cp examples/cccam3.users ipkdata/usr/share/cccam3/cccam3.users
          cp examples/cccam3.readers ipkdata/usr/share/cccam3/cccam3.readers
          cp conf/SoftCam.Key ipkdata/usr/share/cccam3/SoftCam.Key
          cp bins/bin-*/cccam3-* ipkdata/usr/bin/
          ls -la ipkdata/usr/bin/
          cd ipkctrl && tar czf ../control.tar.gz . && cd ..
          cd ipkdata && tar czf ../data.tar.gz . && cd ..
          echo "2.0" > debian-binary
          IPK="enigma2-plugin-softcams-cccam3_${IPK_VERSION}_all.ipk"
          ar r "$IPK" debian-binary control.tar.gz data.tar.gz
          echo "IPK_FILE=$IPK" >> "$GITHUB_ENV"
          ls -la "$IPK"

      - name: Upload ipk to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "$IPK_FILE" --clobber
