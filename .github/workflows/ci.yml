name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libpcsclite-dev

      - name: Build
        run: |
          make clean
          if ! make -j2 2>&1 | tee /tmp/build.log; then
            tail -n 50 /tmp/build.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build with PC/SC
        run: |
          make clean
          if ! make -j2 USE_PCSC=1 2>&1 | tee /tmp/build_pcsc.log; then
            tail -n 50 /tmp/build_pcsc.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Self-tests
        run: |
          if ! make test 2>&1 | tee /tmp/test.log; then
            tail -n 50 /tmp/test.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Smoke test (servidor arranca e responde na API)
        run: |
          cp conf/cccam3.users conf/cccam3.readers conf/cccam3.conf conf/SoftCam.Key /tmp/
          sed -i 's#^file = /var/log/cccam3.log#file = /tmp/cccam3.log#' /tmp/cccam3.conf
          sed -i 's#^file = conf/cccam3.users#file = /tmp/cccam3.users#' /tmp/cccam3.conf
          sed -i 's#^key_file = conf/SoftCam.Key#key_file = /tmp/SoftCam.Key#' /tmp/cccam3.conf
          ./bin/cccam3 -c /tmp/cccam3.conf > /tmp/cccam3_stdout.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Servidor morreu no arranque"
            tail -n 60 /tmp/cccam3.log /tmp/cccam3_stdout.log | sed 's/^/::error::/'
            exit 1
          fi
          if ! curl -fsS http://localhost:8080/status | grep -q '"status": "online"'; then
            echo "::error::/status nao respondeu"
            tail -n 60 /tmp/cccam3.log /tmp/cccam3_stdout.log | sed 's/^/::error::/'
            kill $SERVER_PID
            exit 1
          fi
          if ! curl -fsS http://localhost:8080/stats | grep -q '"cache"'; then
            echo "::error::/stats nao respondeu"
            kill $SERVER_PID
            exit 1
          fi
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "Smoke test OK"

      - name: Publish debug logs (se falhou)
        if: failure()
        run: |
          mkdir -p ci-debug
          cp /tmp/cccam3.log /tmp/cccam3_stdout.log /tmp/build.log /tmp/build_pcsc.log /tmp/test.log ci-debug/ 2>/dev/null || true
          git config user.name "CI Debug"
          git config user.email "ci@localhost"
          git add -f ci-debug/ 2>/dev/null || true
          git commit -m "CI debug logs $(date -u +%Y%m%d%H%M%S)" || true
          git push origin HEAD:ci-debug || true
