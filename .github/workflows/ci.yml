name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libpcsclite-dev

      - name: Build
        run: |
          set -o pipefail
          make clean
          if ! make -j2 2>&1 | tee /tmp/build.log; then
            tail -n 50 /tmp/build.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build with PC/SC
        run: |
          set -o pipefail
          make clean
          if ! make -j2 USE_PCSC=1 2>&1 | tee /tmp/build_pcsc.log; then
            tail -n 50 /tmp/build_pcsc.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Self-tests
        run: |
          set -o pipefail
          if ! make test 2>&1 | tee /tmp/test.log; then
            tail -n 50 /tmp/test.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Smoke test (servidor arranca e responde na API)
        run: |
          cp conf/cccam3.users conf/cccam3.readers conf/cccam3.conf conf/SoftCam.Key /tmp/
          sed -i 's#^file = /var/log/cccam3.log#file = /tmp/cccam3.log#' /tmp/cccam3.conf
          sed -i 's#^file = conf/cccam3.users#file = /tmp/cccam3.users#' /tmp/cccam3.conf
          sed -i 's#^key_file = conf/SoftCam.Key#key_file = /tmp/SoftCam.Key#' /tmp/cccam3.conf
          ./bin/cccam3 -c /tmp/cccam3.conf > /tmp/cccam3_stdout.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Servidor morreu no arranque"
            tail -n 60 /tmp/cccam3.log /tmp/cccam3_stdout.log | sed 's/^/::error::/'
            exit 1
          fi
          if ! curl -fsS http://localhost:8080/status | grep -q '"status": "online"'; then
            echo "::error::/status nao respondeu"
            tail -n 60 /tmp/cccam3.log /tmp/cccam3_stdout.log | sed 's/^/::error::/'
            kill $SERVER_PID
            exit 1
          fi
          if ! curl -fsS http://localhost:8080/stats | grep -q '"cache"'; then
            echo "::error::/stats nao respondeu"
            kill $SERVER_PID
            exit 1
          fi
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "Smoke test OK"

      - name: Publish debug logs (se falhou)
        if: failure()
        run: |
          mkdir -p ci-debug
          cp /tmp/cccam3.log /tmp/cccam3_stdout.log /tmp/build.log /tmp/build_pcsc.log /tmp/test.log ci-debug/ 2>/dev/null || true
          git config user.name "CI Debug"
          git config user.email "ci@localhost"
          git add -f ci-debug/ 2>/dev/null || true
          git commit -m "CI debug logs $(date -u +%Y%m%d%H%M%S)" || true
          git push origin HEAD:ci-debug || true

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build com ASan/UBSan
        run: |
          make clean
          make CC=gcc CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -Wno-deprecated-declarations -Iinclude -Isrc/core -Isrc/network -Isrc/CCshare -Isrc/api -Isrc/hardware -DUSE_OPENSSL" LDFLAGS="-fsanitize=address,undefined -lssl -lcrypto -lm -lpthread -latomic"

      - name: Self-tests sob sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make test

  werror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build estrito (-Werror)
        run: |
          make clean
          make CC=gcc CFLAGS="-Wall -Wextra -Werror -Wno-deprecated-declarations -O2 -Iinclude -Isrc/core -Isrc/network -Isrc/CCshare -Isrc/api -Isrc/hardware -DUSE_OPENSSL"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev

      - name: Fuzz do parser (60s)
        run: |
          clang -g -O1 -fsanitize=fuzzer,address -Iinclude -Isrc/core -Isrc/network -Isrc/CCshare -Isrc/api -Isrc/hardware -DUSE_OPENSSL \
            fuzz/parse_fuzz.c \
            src/network/cccam3_protocol.c \
            src/network/cccam3_crypto.c \
            src/network/cccam3_crypto_advanced.c \
            src/core/cccam3_utils.c \
            src/core/cccam3_logger.c \
            -lcrypto -lssl -o /tmp/parse_fuzz
          /tmp/parse_fuzz -max_total_time=60 -max_len=512
